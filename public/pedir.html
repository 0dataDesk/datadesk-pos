<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
/* ── Reset ─────────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
}

/* ── Variables (defaults; JS sobreescribe --primary y --on-pri) ──────────── */
:root{
  --bg:      #FAF6EF;
  --surface: #FFFFFF;
  --primary: #3D0014;
  --pdk:     #280009;
  --pdim:    rgba(61,0,20,.08);
  --pdim2:   rgba(61,0,20,.15);
  --on-pri:  #F2E0C8;
  --text:    #1A0008;
  --muted:   #7A5060;
  --border:  rgba(61,0,20,.10);
  --shadow:  0 2px 14px rgba(61,0,20,.09);
}

/* ── Animations ─────────────────────────────────────────────────────────── */
@keyframes spin    {to{transform:rotate(360deg)}}
@keyframes slideUp {from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn  {from{opacity:0}to{opacity:1}}

/* ── App shell ───────────────────────────────────────────────────────────── */
#app{min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none!important;}

/* ── Header ──────────────────────────────────────────────────────────────── */
.site-hdr{
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
  box-shadow:0 1px 8px rgba(61,0,20,.06);
}
.site-hdr-inner{
  max-width:960px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
/* Logo */
.logo{display:flex;align-items:center;gap:10px;}
.logo-box{
  background:var(--primary);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',cursive;color:var(--on-pri);flex-shrink:0;
}
.logo-name{font-family:'Bebas Neue',cursive;letter-spacing:4px;color:var(--primary);line-height:1;}
/* Cart button */
.cart-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--pdim);border:1.5px solid var(--border);border-radius:99px;
  padding:8px 16px;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;
}
.cart-btn:hover{background:var(--pdim2);}
.cart-btn.on{background:var(--primary);border-color:var(--primary);}
.cart-btn.on .cb-count,.cart-btn.on .cb-total{color:var(--on-pri);}
.cb-icon {font-size:18px;line-height:1;}
.cb-count{font-family:'Bebas Neue',cursive;font-size:20px;color:var(--primary);}
.cb-total{font-size:14px;font-weight:600;color:var(--muted);}

/* ── Page content ─────────────────────────────────────────────────────────── */
#main-content{
  flex:1;max-width:960px;width:100%;margin:0 auto;
  padding:0 20px 110px;/* bottom clearance for fixed nav */
}
.page-title{
  font-family:'Bebas Neue',cursive;
  font-size:clamp(2.2rem,6vw,3.4rem);
  letter-spacing:2px;color:var(--primary);
  padding:28px 0 22px;line-height:1;
}

/* ── Item grid ────────────────────────────────────────────────────────────── */
.item-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}

/* ── Item card ────────────────────────────────────────────────────────────── */
.item-card{
  background:var(--surface);border-radius:16px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  overflow:hidden;transition:transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;
}
.item-card:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(61,0,20,.14);}
.item-thumb{
  width:100%;height:160px;
  background:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:60px;
  flex-shrink:0;
}
.item-body{padding:16px 16px 12px;flex:1;}
.item-name {font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:1px;color:var(--text);line-height:1.15;}
.item-desc {font-size:13px;color:var(--muted);margin-top:4px;min-height:20px;line-height:1.5;}
.item-price{font-family:'Bebas Neue',cursive;font-size:1.65rem;color:var(--primary);margin-top:8px;}
.item-foot {padding:0 16px 16px;}

/* Drink inline row */
.drink-row{display:flex;align-items:center;gap:10px;margin-top:8px;}

/* ── Stepper ──────────────────────────────────────────────────────────────── */
.stepper{display:flex;align-items:center;gap:6px;}
.stbtn{
  width:32px;height:32px;border-radius:8px;
  border:1.5px solid var(--border);background:var(--pdim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--primary);font-weight:700;
  transition:all .12s;line-height:1;font-family:'DM Sans',sans-serif;
}
.stbtn:hover{background:var(--pdim2);}
.stbtn.plus{background:var(--primary);border-color:var(--primary);color:var(--on-pri);}
.stbtn.plus:hover{background:var(--pdk);}
.stval{font-family:'Bebas Neue',cursive;font-size:1.3rem;min-width:22px;text-align:center;color:var(--text);}

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn-pri{
  background:var(--primary);border:none;border-radius:10px;
  padding:13px 20px;color:var(--on-pri);font-size:15px;font-weight:600;
  cursor:pointer;transition:background .15s,transform .1s;
  font-family:'DM Sans',sans-serif;line-height:1;
}
.btn-pri:hover  {background:var(--pdk);}
.btn-pri:active {transform:scale(.97);}
.btn-pri.full   {width:100%;padding:16px;font-size:16px;}
.btn-pri.sm     {padding:8px 14px;font-size:13px;}
.btn-out{
  background:transparent;border:1.5px solid var(--primary);border-radius:10px;
  padding:7px 12px;color:var(--primary);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif;
}
.btn-out:hover{background:var(--pdim);}
.btn-ghost{background:none;border:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;padding:4px;}

/* ── Bottom nav ───────────────────────────────────────────────────────────── */
.bot-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--border);
  box-shadow:0 -2px 12px rgba(61,0,20,.06);z-index:20;
}
.bot-nav-inner{
  max-width:960px;margin:0 auto;
  padding:8px 12px 10px;display:flex;gap:8px;
}
.nav-btn{
  flex:1;padding:10px 6px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;text-align:center;transition:all .15s;
  font-family:'DM Sans',sans-serif;
}
.nav-btn:hover{border-color:var(--primary);background:var(--pdim);}
.nb-icon {font-size:22px;display:block;line-height:1.2;}
.nb-lbl  {font-size:12px;font-weight:600;color:var(--muted);display:block;margin-top:2px;}

/* ── Sheet (slide-up) ─────────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;}
.sh-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);}
.sh-panel{
  position:relative;background:var(--surface);
  border-radius:22px 22px 0 0;max-height:90vh;
  display:flex;flex-direction:column;
  animation:slideUp .32s cubic-bezier(.32,.72,0,1);
}
.sh-handle{display:flex;justify-content:center;padding:12px 0 6px;}
.sh-handle::after{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--border);}
.sh-hdr{padding:4px 20px 16px;border-bottom:1px solid var(--border);}
.sh-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.sh-name{font-family:'Bebas Neue',cursive;font-size:1.8rem;letter-spacing:1px;color:var(--text);}
.sh-scroll{flex:1;overflow-y:auto;padding:14px 20px 8px;}
.sh-foot{padding:14px 20px 24px;border-top:1px solid var(--border);}

/* Sheet sections */
.sh-sec{margin-bottom:22px;}
.sh-sec:last-child{margin-bottom:0;}
.sh-sec-ttl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

/* Ingredient chips — ON by default */
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:var(--pdim);border:1.5px solid rgba(61,0,20,.20);border-radius:20px;
  padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text);
  transition:all .14s;user-select:none;
}
.chip.off{background:#F5EDEF;border-color:var(--border);color:var(--muted);text-decoration:line-through;}

/* Modifier chips (extras / salsas) — OFF by default */
.chip-mod{
  background:var(--bg);border:1.5px solid var(--border);border-radius:20px;
  padding:7px 14px;cursor:pointer;font-size:13px;color:var(--muted);
  transition:all .14s;user-select:none;display:inline-block;
}
.chip-mod.on{background:var(--pdim);border-color:rgba(61,0,20,.22);color:var(--text);}
/* Salsa grid — 2 cols on mobile, full row on wider screens */
.chip-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(min-width:480px){.chip-grid-2{grid-template-columns:repeat(4,1fr);}}

/* ── Cart sheet ───────────────────────────────────────────────────────────── */
.cart-line{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--border);
}
.cart-line:last-child{border-bottom:none;}
.cl-body{flex:1;min-width:0;}
.cl-name   {font-weight:600;font-size:15px;color:var(--text);}
.cl-mods   {font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6;}
.cl-importe{font-family:'Bebas Neue',cursive;font-size:1.35rem;color:var(--primary);white-space:nowrap;}
.cl-actions{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap;}
.total-row {display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 16px;}
.tot-lbl   {font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:1px;}
.tot-amt   {font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--primary);}

/* ── Loading / Error ──────────────────────────────────────────────────────── */
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
.load-c {display:flex;align-items:center;justify-content:center;padding:56px;}
.err-box{background:#FFF0F0;border:1px solid rgba(200,0,0,.2);border-radius:10px;padding:14px;color:#C00;font-size:14px;margin:20px 0;}

/* ── Pago stub ────────────────────────────────────────────────────────────── */
.pago-view{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px 20px;}
.pago-view h2{font-family:'Bebas Neue',cursive;font-size:2.5rem;letter-spacing:2px;color:var(--primary);margin:16px 0 10px;}
.pago-view p {color:var(--muted);font-size:15px;max-width:280px;line-height:1.6;}
  </style>
</head>
<body>
<div id="app">

  <!-- ── HEADER ─────────────────────────────────────────────────────────── -->
  <header class="site-hdr">
    <div class="site-hdr-inner">
      <div class="logo" id="hdr-logo"></div>
      <button class="cart-btn" id="cart-btn" onclick="abrirCart()">
        <span class="cb-icon">🛒</span>
        <span class="cb-count" id="cb-count">0</span>
        <span class="cb-total" id="cb-total"></span>
      </button>
    </div>
  </header>

  <!-- ── CONTENIDO PRINCIPAL ────────────────────────────────────────────── -->
  <div id="main-content">
    <div class="load-c"><div class="spinner"></div></div>
  </div>

  <!-- ── BOTTOM NAV ─────────────────────────────────────────────────────── -->
  <nav class="bot-nav" id="bot-nav">
    <div class="bot-nav-inner" id="nav-btns"></div>
  </nav>

</div><!-- /app -->

<!-- ── SHEET: PERSONALIZACIÓN ─────────────────────────────────────────────── -->
<div class="sheet hidden" id="sheet-cz">
  <div class="sh-backdrop" onclick="cerrarCz()"></div>
  <div class="sh-panel">
    <div class="sh-handle"></div>
    <div class="sh-hdr">
      <div class="sh-row">
        <span class="sh-name" id="cz-name"></span>
        <button class="btn-ghost" onclick="cerrarCz()" style="font-size:18px;">✕</button>
      </div>
      <!-- Cantidad -->
      <div class="sh-row" style="margin-top:12px;">
        <span style="font-size:13px;font-weight:500;color:var(--muted);">Cantidad</span>
        <div class="stepper">
          <button class="stbtn" onclick="czCant(-1)">−</button>
          <span class="stval" id="cz-cant">1</span>
          <button class="stbtn plus" onclick="czCant(1)">+</button>
        </div>
      </div>
    </div>
    <div class="sh-scroll" id="cz-scroll"></div>
    <div class="sh-foot">
      <button class="btn-pri full" id="cz-add-btn" onclick="guardarCz()">Agregar al pedido — $0</button>
    </div>
  </div>
</div>

<!-- ── SHEET: CARRITO ─────────────────────────────────────────────────────── -->
<div class="sheet hidden" id="sheet-cart">
  <div class="sh-backdrop" onclick="cerrarCart()"></div>
  <div class="sh-panel">
    <div class="sh-handle"></div>
    <div class="sh-hdr">
      <div class="sh-row">
        <span class="sh-name">Tu Pedido</span>
        <button class="btn-ghost" onclick="cerrarCart()" style="font-size:18px;">✕</button>
      </div>
    </div>
    <div class="sh-scroll" id="cart-lines"></div>
    <div class="sh-foot">
      <div class="total-row">
        <span class="tot-lbl">Total</span>
        <span class="tot-amt" id="cart-total-amt">$0</span>
      </div>
      <button class="btn-pri full" onclick="irPago()">Continuar al pago →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/config.js"></script>
<script src="src/supabase.js"></script>
<script>
// ── Constantes ────────────────────────────────────────────────────────────────
const PAGES = [
  { id:'res',       cat:'Hamburguesas',    label:'Res',       emoji:'🍔', title:'Hamburguesas de Res'   },
  { id:'pollo',     cat:'Pollo',           label:'Pollo',     emoji:'🍗', title:'Hamburguesas de Pollo' },
  { id:'papas',     cat:'Acompañamientos', label:'Papas',     emoji:'🍟', title:'Papas'                 },
  { id:'refrescos', cat:'Bebidas',         label:'Bebidas',   emoji:'🥤', title:'Bebidas'               },
]
const MOD_CATS  = ['Extras','Salsas']
const MENU_CATS = ['Hamburguesas','Pollo','Acompañamientos','Bebidas']

// ── Estado global ─────────────────────────────────────────────────────────────
let menuItems  = []    // ítems del menú (sin Extras/Salsas)
let modExtras  = []    // ítems de categoría Extras
let modSalsas  = []    // ítems de categoría Salsas
let ingCache   = {}    // id_receta → [{producto, nombre_corto}]
let carrito    = []    // líneas del carrito
let drinkQty   = {}    // id_receta → qty inline para bebidas
let currentPg  = 'res'

// Estado de la hoja de personalización
let cz = { item:null, cartIdx:null, cantidad:1, quitados:[], extras:[], nota:'' }

// ── Branding ──────────────────────────────────────────────────────────────────
function applyBranding() {
  const p = POS.BRANDING.primaryColor  // ej. '#3D0014'
  const d = POS.BRANDING.primaryDark   // ej. '#280009'
  const o = POS.BRANDING.textOnPrimary // ej. '#F2E0C8'
  const r = document.documentElement.style
  r.setProperty('--primary', p)
  r.setProperty('--pdk',     d)
  r.setProperty('--on-pri',  o)
  // Derivar pdim desde primaryColor
  const h = p.replace('#','')
  const R = parseInt(h.slice(0,2),16), G = parseInt(h.slice(2,4),16), B = parseInt(h.slice(4,6),16)
  r.setProperty('--pdim',  `rgba(${R},${G},${B},.08)`)
  r.setProperty('--pdim2', `rgba(${R},${G},${B},.15)`)

  document.title = POS.BRANDING.nombre + ' — Menú'

  const N   = POS.BRANDING.nombre
  const ltr = N[0]
  const mkLogo = sz => `
    <div class="logo-box" style="width:${sz*.72}px;height:${sz*.72}px;font-size:${sz*.44}px;">${ltr}</div>
    <span class="logo-name" style="font-size:${sz}px;">${N.toUpperCase()}</span>`
  document.getElementById('hdr-logo').innerHTML = mkLogo(36)
}

// ── Carga de datos ────────────────────────────────────────────────────────────
async function cargarMenu() {
  try {
    const { data: recetas, error: e1 } = await window._db
      .from('catalogo_recetas')
      .select('id_receta, nombre_platillo, categoria, descripcion')
      .eq('tenant_id', POS.TENANT_ID)
      .eq('fuente',    POS.FUENTE)
      .eq('activo',    true)
    if (e1) throw e1

    const ids = recetas.map(r => r.id_receta)
    const { data: precios, error: e2 } = await window._db
      .from('precios_venta')
      .select('id_item, precio')
      .eq('tenant_id', POS.TENANT_ID)
      .eq('lista',     POS.LISTA_PRECIO)
      .eq('vigente',   true)
      .in('id_item',   ids)
    if (e2) throw e2

    const pm = {}; if (precios) precios.forEach(p => { pm[p.id_item] = p.precio })

    const all = recetas.map(r => ({ id_receta:r.id_receta, nombre:r.nombre_platillo, categoria:r.categoria, descripcion:r.descripcion||'', precio:pm[r.id_receta]||0 }))
    modExtras = all.filter(r => r.categoria === 'Extras')
    modSalsas = all.filter(r => r.categoria === 'Salsas')
    menuItems = all.filter(r => MENU_CATS.includes(r.categoria))

    goPage('res')
  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="err-box">Error al cargar el menú: ${e.message}</div>`
  }
}

// ── Navegación ────────────────────────────────────────────────────────────────
function goPage(pgId) {
  currentPg = pgId
  const pg     = PAGES.find(p => p.id === pgId)
  const others = PAGES.filter(p => p.id !== pgId)
  const items  = getPgItems(pgId)

  // Contenido
  const cont = document.getElementById('main-content')
  cont.innerHTML = `<h1 class="page-title">${pg.title}</h1><div class="item-grid" id="item-grid"></div>`
  const grid = document.getElementById('item-grid')

  items.forEach(it => {
    const card = document.createElement('div')
    card.className = 'item-card'
    if (it.categoria === 'Bebidas') {
      drinkQty[it.id_receta] = drinkQty[it.id_receta] || 1
      card.innerHTML = `
        <div class="item-thumb">${pg.emoji}</div>
        <div class="item-body">
          <div class="item-name">${it.nombre}</div>
          ${it.descripcion ? `<div class="item-desc">${it.descripcion}</div>` : ''}
          <div class="item-price">$${it.precio}</div>
        </div>
        <div class="item-foot">
          <div class="drink-row">
            <div class="stepper">
              <button class="stbtn" onclick="adjDrink('${it.id_receta}',-1)">−</button>
              <span class="stval" id="dq-${it.id_receta}">${drinkQty[it.id_receta]}</span>
              <button class="stbtn plus" onclick="adjDrink('${it.id_receta}',1)">+</button>
            </div>
            <button class="btn-pri sm" data-dadd="${it.id_receta}" onclick="addDrink('${it.id_receta}')">Agregar →</button>
          </div>
        </div>`
    } else {
      card.innerHTML = `
        <div class="item-thumb">${pg.emoji}</div>
        <div class="item-body">
          <div class="item-name">${it.nombre}</div>
          ${it.descripcion ? `<div class="item-desc">${it.descripcion}</div>` : ''}
          <div class="item-price">$${it.precio}</div>
        </div>
        <div class="item-foot">
          <button class="btn-pri full" onclick="abrirCz('${it.id_receta}')">Agregar y personalizar</button>
        </div>`
    }
    grid.appendChild(card)
  })

  // Navegación inferior
  document.getElementById('bot-nav').classList.remove('hidden')
  document.getElementById('nav-btns').innerHTML = others.map(p => `
    <button class="nav-btn" onclick="goPage('${p.id}')">
      <span class="nb-icon">${p.emoji}</span>
      <span class="nb-lbl">${p.label}</span>
    </button>`).join('')
}

function getPgItems(pgId) {
  let items
  switch(pgId) {
    case 'res':       items = menuItems.filter(it => it.categoria === 'Hamburguesas'); break
    case 'pollo':     items = menuItems.filter(it => it.categoria === 'Pollo'); break
    case 'papas':     items = menuItems.filter(it => it.categoria === 'Acompañamientos'); break
    case 'refrescos': items = menuItems.filter(it => it.categoria === 'Bebidas' && it.nombre !== 'Limonada'); break
    default: items = []
  }
  return items.sort((a, b) => a.precio - b.precio)  // AJUSTE 5: precio ascendente
}

// ── Bebidas (inline) ──────────────────────────────────────────────────────────
function adjDrink(id, delta) {
  drinkQty[id] = Math.max(1, (drinkQty[id]||1) + delta)
  const el = document.getElementById('dq-' + id)
  if (el) el.textContent = drinkQty[id]
}

function addDrink(id) {
  const it = menuItems.find(x => x.id_receta === id)
  if (!it) return
  const qty = drinkQty[id] || 1
  const same = carrito.find(x => x.id_receta === id && !x.mods.extras.length && !x.mods.nota)
  if (same) {
    same.cantidad += qty; same.importe = same.precio_base * same.cantidad
  } else {
    carrito.push({ id_receta:it.id_receta, nombre:it.nombre, precio_base:it.precio,
      cantidad:qty, mods:{quitados:[],extras:[],nota:''}, importe:it.precio*qty })
  }
  drinkQty[id] = 1
  const el = document.getElementById('dq-' + id); if (el) el.textContent = 1
  updateCartBar()
  const btn = document.querySelector(`[data-dadd="${id}"]`)
  if (btn) {
    const orig = btn.textContent
    btn.textContent = '✓ Agregado'; btn.style.background = '#22c55e'
    setTimeout(() => { btn.textContent = orig; btn.style.background = '' }, 1200)
  }
}

// ── Personalización ───────────────────────────────────────────────────────────
function getItemType(it) {
  if (it.categoria === 'Bebidas')          return 'drink'
  if (it.categoria === 'Acompañamientos')  return 'side'
  return 'burger'  // Hamburguesas, Pollo
}

async function abrirCz(idReceta, cartIdx = null) {
  const item = menuItems.find(x => x.id_receta === idReceta)
  if (!item) return

  if (cartIdx !== null && carrito[cartIdx]) {
    const c = carrito[cartIdx]
    cz = { item, cartIdx, cantidad:c.cantidad,
      quitados:[...c.mods.quitados], extras:c.mods.extras.map(e=>({...e})), nota:c.mods.nota }
  } else {
    cz = { item, cartIdx:null, cantidad:1, quitados:[], extras:[], nota:'' }
  }

  document.getElementById('cz-name').textContent = item.nombre
  document.getElementById('cz-cant').textContent = cz.cantidad
  document.getElementById('sheet-cz').classList.remove('hidden')
  actualizarCzBtn()

  const type   = getItemType(item)
  const scroll = document.getElementById('cz-scroll')
  scroll.innerHTML = ''

  if (type === 'burger' || type === 'side') {
    // Sección ingredientes — carga async
    const ingDiv = document.createElement('div'); ingDiv.className = 'sh-sec'; ingDiv.id = 'ing-sec'
    ingDiv.innerHTML = `<div class="sh-sec-ttl">Ingredientes</div><div class="load-c" style="padding:16px;" id="ing-spinner"><div class="spinner" style="width:24px;height:24px;"></div></div>`
    scroll.appendChild(ingDiv)

    // Extras (solo hamburguesas, con precio por chip)
    if (type === 'burger' && modExtras.length) {
      scroll.insertAdjacentHTML('beforeend', buildModSec('Extras', modExtras, false))
    }
    // Salsas (hamburguesas y papas, precio en título)
    if (modSalsas.length) {
      scroll.insertAdjacentHTML('beforeend', buildModSec('Salsas — $15 c/u', modSalsas, true))
    }
  }

  // Nota (todos excepto bebidas puras)
  if (type !== 'drink') {
    scroll.insertAdjacentHTML('beforeend', `
      <div class="sh-sec">
        <div class="sh-sec-ttl">Nota especial</div>
        <textarea id="cz-nota" rows="2"
          style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;
                 font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);
                 background:var(--bg);resize:none;line-height:1.5;"
          placeholder="Instrucción especial para cocina..."
          oninput="cz.nota=this.value">${cz.nota||''}</textarea>
      </div>`)
  }

  // Cargar ingredientes async
  if (type !== 'drink') {
    if (!ingCache[idReceta]) {
      const { data } = await window._db
        .from('receta_ingredientes')
        .select('producto, id_producto, productos(nombre_corto)')
        .eq('tenant_id', POS.TENANT_ID)
        .eq('id_receta', idReceta)
        .eq('activo', true)
      ingCache[idReceta] = data || []
    }
    // Verificar que la hoja sigue abierta para este ítem
    if (cz.item?.id_receta !== idReceta) return

    const ings    = ingCache[idReceta]
    const ingSec  = document.getElementById('ing-sec')
    if (!ingSec) return

    if (ings.length) {
      ingSec.innerHTML = `<div class="sh-sec-ttl">Ingredientes — toca para quitar</div>
        <div class="chip-grid">${ings.map(ing => {
          const display = ing.productos?.nombre_corto || ing.producto
          const isOff   = cz.quitados.includes(ing.producto)
          return `<div class="chip${isOff?' off':''}" data-ing="${ing.producto}" data-disp="${display}"
            onclick="toggleChip(this)">${isOff?'✕ ':''}${display}</div>`
        }).join('')}</div>`
    } else {
      ingSec.remove()  // AJUSTE 2: sin ingredientes → ocultar sección completamente
    }
  }
}

// isSalsa=true → grid 2 cols, strip "Salsa " prefix, no price per chip
// isSalsa=false → flex-wrap, show "+$precio" on each chip
function buildModSec(title, mods, isSalsa) {
  const gridClass = isSalsa ? 'chip-grid-2' : 'chip-grid'
  return `<div class="sh-sec">
    <div class="sh-sec-ttl">${title}</div>
    <div class="${gridClass}">${mods.map(m => {
      const isOn = cz.extras.some(e => e.id === m.id_receta)
      let label
      if (isSalsa) {
        // Strip "Salsa " prefix → "Furia Original", "Hot Honey", etc.
        label = m.nombre.replace(/^Salsa\s+/i, '')
      } else {
        // Extras: name + price hint
        label = m.nombre + (m.precio > 0 ? ` <span style="opacity:.6;font-size:11px;">+$${m.precio}</span>` : '')
      }
      return `<div class="chip-mod${isOn?' on':''}" id="mod-${m.id_receta}"
        onclick="toggleMod('${m.id_receta}')">${label}</div>`
    }).join('')}</div>
  </div>`
}

function toggleChip(el) {
  el.classList.toggle('off')
  const ing  = el.dataset.ing
  const disp = el.dataset.disp
  if (el.classList.contains('off')) {
    el.textContent = '✕ ' + disp
    if (!cz.quitados.includes(ing)) cz.quitados.push(ing)
  } else {
    el.textContent = disp
    cz.quitados = cz.quitados.filter(q => q !== ing)
  }
}

function toggleMod(id) {
  const def = [...modExtras, ...modSalsas].find(m => m.id_receta === id)
  if (!def) return
  const idx = cz.extras.findIndex(e => e.id === id)
  if (idx >= 0) {
    cz.extras.splice(idx, 1)              // ya estaba ON → apagar
  } else {
    cz.extras.push({ id, nombre:def.nombre, precio:def.precio })  // OFF → encender
  }
  const el = document.getElementById('mod-' + id)
  if (el) el.classList.toggle('on', cz.extras.some(e => e.id === id))
  actualizarCzBtn()
}

function czCant(delta) {
  cz.cantidad = Math.max(1, cz.cantidad + delta)
  document.getElementById('cz-cant').textContent = cz.cantidad
  actualizarCzBtn()
}

function actualizarCzBtn() {
  const extSum = cz.extras.reduce((s, e) => s + (e.precio || 0), 0)
  const total  = ((cz.item?.precio || 0) + extSum) * cz.cantidad
  const btn    = document.getElementById('cz-add-btn')
  if (btn) btn.textContent = (cz.cartIdx !== null ? 'Actualizar — ' : 'Agregar al pedido — ') + '$' + total
}

function guardarCz() {
  const notaEl = document.getElementById('cz-nota')
  if (notaEl) cz.nota = notaEl.value.trim()
  const extSum  = cz.extras.reduce((s, e) => s + (e.precio || 0), 0)
  const importe = ((cz.item?.precio||0) + extSum) * cz.cantidad
  const entry = {
    id_receta:  cz.item.id_receta,
    nombre:     cz.item.nombre,
    precio_base:cz.item.precio,
    cantidad:   cz.cantidad,
    mods: {
      quitados: [...cz.quitados],
      extras:   cz.extras.map(e => ({ id:e.id, nombre:e.nombre, precio:e.precio })),
      nota:     cz.nota,
    },
    importe,
  }
  const wasEditing = cz.cartIdx !== null
  if (wasEditing) carrito[cz.cartIdx] = entry
  else carrito.push(entry)
  cerrarCz()
  updateCartBar()
  if (wasEditing) setTimeout(abrirCart, 80)
}

function cerrarCz() {
  document.getElementById('sheet-cz').classList.add('hidden')
  cz = { item:null, cartIdx:null, cantidad:1, quitados:[], extras:[], nota:'' }
}

// ── Carrito ───────────────────────────────────────────────────────────────────
function updateCartBar() {
  const count = carrito.reduce((s, i) => s + i.cantidad, 0)
  const total = carrito.reduce((s, i) => s + i.importe, 0)
  const btn   = document.getElementById('cart-btn')
  document.getElementById('cb-count').textContent = count > 0 ? count : '0'
  document.getElementById('cb-total').textContent = count > 0 ? '$' + total : ''
  btn.classList.toggle('on', count > 0)
}

function abrirCart() {
  renderCart()
  document.getElementById('sheet-cart').classList.remove('hidden')
}

function cerrarCart() {
  document.getElementById('sheet-cart').classList.add('hidden')
}

function renderCart() {
  const lines = document.getElementById('cart-lines')
  const total = carrito.reduce((s, i) => s + i.importe, 0)
  document.getElementById('cart-total-amt').textContent = '$' + total

  if (carrito.length === 0) {
    lines.innerHTML = `<div style="text-align:center;padding:44px;color:var(--muted);">
      <div style="font-size:48px;margin-bottom:12px;">🛒</div>
      Carrito vacío — ¡elige algo rico!
    </div>`
    return
  }

  lines.innerHTML = ''
  carrito.forEach((item, idx) => {
    const parts = []
    if (item.mods.quitados.length) parts.push('Sin: ' + item.mods.quitados.join(', '))
    if (item.mods.extras.length) parts.push(item.mods.extras.map(e => e.nombre).join(', '))
    if (item.mods.nota) parts.push('📝 ' + item.mods.nota)

    const line = document.createElement('div'); line.className = 'cart-line'
    line.innerHTML = `
      <div class="cl-body">
        <div class="cl-name">${item.nombre}</div>
        ${parts.length?`<div class="cl-mods">${parts.join(' · ')}</div>`:''}
        <div class="cl-actions">
          <div class="stepper">
            <button class="stbtn" onclick="cartCant(${idx},-1)">−</button>
            <span class="stval">${item.cantidad}</span>
            <button class="stbtn plus" onclick="cartCant(${idx},1)">+</button>
          </div>
          <button class="btn-out" onclick="editarCart(${idx})">✏️ Editar</button>
          <button class="btn-ghost" style="color:#C00;font-size:18px;" onclick="quitarCart(${idx})">✕</button>
        </div>
      </div>
      <span class="cl-importe">$${item.importe}</span>`
    lines.appendChild(line)
  })
}

function cartCant(idx, delta) {
  carrito[idx].cantidad = Math.max(1, carrito[idx].cantidad + delta)
  const extSum = carrito[idx].mods.extras.reduce((s, e) => s + (e.precio || 0), 0)
  carrito[idx].importe  = (carrito[idx].precio_base + extSum) * carrito[idx].cantidad
  renderCart(); updateCartBar()
}

function quitarCart(idx) {
  carrito.splice(idx, 1)
  renderCart(); updateCartBar()
}

async function editarCart(idx) {
  cerrarCart()
  await abrirCz(carrito[idx].id_receta, idx)
}

// ── Pago (stub) ───────────────────────────────────────────────────────────────
function irPago() {
  cerrarCart()
  document.getElementById('bot-nav').classList.add('hidden')
  document.getElementById('main-content').innerHTML = `
    <div class="pago-view">
      <div style="font-size:64px;">🚧</div>
      <h2>Pago próximamente</h2>
      <p>Esta sección estará disponible muy pronto.<br>Tu pedido está guardado.</p>
      <button class="btn-pri" style="margin-top:32px;max-width:260px;" onclick="volverMenu()">← Volver al menú</button>
    </div>`
}

function volverMenu() {
  goPage(currentPg)
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  applyBranding()
  cargarMenu()
})
</script>
