<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KDS | Furia</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>👨‍🍳</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: hidden; }
    .kds-header {
      background: #0A0003;
      border-bottom: 3px solid var(--c-accent);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kds-header h1 { font-size: 1.1rem; margin: 0; }
    .kds-clock { font-size: 1.1rem; font-weight: 700; color: var(--c-accent); font-variant-numeric: tabular-nums; }
    .kds-page { display: flex; flex-direction: column; height: 100vh; }
    .kds-body { flex: 1; overflow: hidden; display: flex; }
  </style>
</head>
<body>

<div class="kds-page">
  <div class="kds-header">
    <h1 id="kds-tenant-nombre">Cocina</h1>
    <span id="kds-conn" style="font-size:0.75rem;font-weight:600;">🟡 Conectando...</span>
    <span class="kds-clock" id="kds-clock">00:00:00</span>
  </div>
  <div class="kds-body">
    <div class="kds-layout" style="flex:1;">
      <div class="kds-main">
        <div class="kds-grid" id="kds-grid"></div>
        <div id="kds-empty" style="display:none;text-align:center;padding:60px 20px;color:rgba(242,224,200,0.3);">
          <div style="font-size:3rem;">🍳</div>
          <div style="margin-top:12px;font-size:1rem;">Sin órdenes activas</div>
        </div>
      </div>
      <div class="kds-cemetery">
        <h3>Entregadas</h3>
        <div id="kds-cemetery-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="src/config.js"></script>
<script src="src/tenant-theme.js"></script>
<script src="src/supabase.js"></script>
<script>
// ── Estado ────────────────────────────────────────────────────────────────────
const ordenes        = {}  // id_venta → { orden, items, itemsEstado }
const itemsEstadoIdx = {}  // id_item_estado → id_venta  (índice inverso para lookup rápido)
const cementerio     = []

// ── Reloj ─────────────────────────────────────────────────────────────────────
function tickClock() {
  const now = new Date()
  const hh = String(now.getHours()).padStart(2,'0')
  const mm = String(now.getMinutes()).padStart(2,'0')
  const ss = String(now.getSeconds()).padStart(2,'0')
  document.getElementById('kds-clock').textContent = hh + ':' + mm + ':' + ss
}
setInterval(tickClock, 1000)
tickClock()

// ── Semáforo ─────────────────────────────────────────────────────────────────
function colorPlatillo(item) {
  if (item.estado === 'listo') return 'listo'
  const elapsed = (Date.now() - new Date(item.creada_en).getTime()) / 1000
  if (item.tiempo_rojo_seg    && elapsed >= item.tiempo_rojo_seg)    return 'rojo'
  if (item.tiempo_amarillo_seg && elapsed >= item.tiempo_amarillo_seg) return 'amarillo'
  return 'normal'
}

const PRIORIDAD = { rojo: 3, amarillo: 2, normal: 1, listo: 0 }
function colorOrden(itemsEstado) {
  if (!itemsEstado || itemsEstado.length === 0) return 'verde'
  const pendientes = itemsEstado.filter(i => i.estado !== 'listo')
  if (pendientes.length === 0) return 'listo'
  const peor = pendientes.reduce((max, i) => {
    const c = colorPlatillo(i)
    return PRIORIDAD[c] > PRIORIDAD[max] ? c : max
  }, 'normal')
  return peor === 'rojo' ? 'rojo' : peor === 'amarillo' ? 'amarillo' : 'verde'
}

function timerStr(confirmada_en) {
  const sec = Math.floor((Date.now() - new Date(confirmada_en).getTime()) / 1000)
  const m = Math.floor(sec / 60), s = sec % 60
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0')
}

// ── Render tarjeta ─────────────────────────────────────────────────────────────
function crearCard(orden, items, itemsEstado) {
  const card = document.createElement('div')
  card.className = 'kds-card verde'
  card.id = 'kds-ord-' + orden.id_venta
  card.innerHTML = buildCardHTML(orden, items, itemsEstado)
  return card
}

const COLOR_DOT = {
  normal:   'background:#4CAF50',
  amarillo: 'background:#F5A623',
  rojo:     'background:#E53935',
  listo:    'background:#9E9E9E'
}

function buildCardHTML(orden, items, itemsEstado) {
  const col  = colorOrden(itemsEstado)
  const tipo = orden.tipo_entrega || ''

  let itsHTML = ''
  if (itemsEstado && itemsEstado.length > 0) {
    itemsEstado.forEach(ie => {
      const c    = colorPlatillo(ie)
      const dot  = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;${COLOR_DOT[c]}"></span>`
      const listo = ie.estado === 'listo'
      itsHTML += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        ${dot}
        <span style="flex:1;font-size:13px;${listo ? 'text-decoration:line-through;opacity:.5;' : ''}">${ie.nombre_platillo}</span>
      </div>`
    })
  } else {
    // Fallback: items de venta_items sin estado individual
    items.forEach(it => {
      const mods = it.modificadores || {}
      const partes = []
      if (mods.quitados && mods.quitados.length) partes.push('❌ Sin: ' + mods.quitados.join(', '))
      if (mods.extras   && mods.extras.length)   partes.push('➕ ' + mods.extras.map(e => e.nombre).join(', '))
      if (mods.nota) partes.push('📝 ' + mods.nota)
      const modHTML = partes.length
        ? '<div class="kds-mods">' + partes.map(p => '<span class="mod-tag">' + p + '</span>').join('') + '</div>'
        : ''
      itsHTML += `<div class="kds-item">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="kds-item-qty">×${it.cantidad}</span>
          <span class="kds-item-name">${it.nombre}</span>
        </div>${modHTML}
      </div>`
    })
  }

  return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;">
      <span class="kds-folio">${orden.folio || orden.id_venta}</span>
      <span class="kds-timer" id="timer-${orden.id_venta}">${timerStr(orden.confirmada_en)}</span>
    </div>
    <div class="kds-tipo">${tipo}</div>
    <div class="kds-items" style="margin-top:6px;">${itsHTML}</div>`
}

function actualizarCard(idVenta) {
  const o    = ordenes[idVenta]
  if (!o) return
  const card = document.getElementById('kds-ord-' + idVenta)
  if (!card) return
  const col = colorOrden(o.itemsEstado)
  card.className = 'kds-card ' + (col === 'listo' ? 'verde' : col)
  card.innerHTML  = buildCardHTML(o.orden, o.items, o.itemsEstado)
  const t = document.getElementById('timer-' + idVenta)
  if (t) t.textContent = timerStr(o.orden.confirmada_en)
}

// Actualizar timers y colores cada segundo
setInterval(() => {
  Object.keys(ordenes).forEach(idVenta => {
    const o    = ordenes[idVenta]
    const card = document.getElementById('kds-ord-' + idVenta)
    if (!card || !o) return
    const col = colorOrden(o.itemsEstado)
    card.className = 'kds-card ' + (col === 'listo' ? 'verde' : col)
    const t = document.getElementById('timer-' + idVenta)
    if (t) t.textContent = timerStr(o.orden.confirmada_en)
  })
}, 1000)

function mostrarVacio() {
  document.getElementById('kds-empty').style.display = Object.keys(ordenes).length === 0 ? 'block' : 'none'
}

// ── Cementerio ────────────────────────────────────────────────────────────────
function addCementerio(orden) {
  cementerio.unshift(orden)
  if (cementerio.length > 10) cementerio.pop()
  const cont = document.getElementById('kds-cemetery-list')
  cont.innerHTML = ''
  cementerio.forEach(o => {
    const div = document.createElement('div')
    div.className = 'kds-dead-item'
    div.innerHTML = `<span class="kds-dead-folio">${o.folio || o.id_venta}</span><br><span>${o.estado}</span>`
    cont.appendChild(div)
  })
}

// ── Cargar órdenes activas iniciales ──────────────────────────────────────────
async function cargarActivas() {
  const { data: ords } = await window._db
    .from('ordenes_cocina').select('*')
    .eq('tenant_id', POS.TENANT_ID)
    .in('estado', ['pendiente', 'lista'])
    .order('confirmada_en', { ascending: true })

  if (!ords || ords.length === 0) { mostrarVacio(); return }

  const ventaIds = ords.map(o => o.id_venta)
  const ordenIds = ords.map(o => o.id)

  const [{ data: ventas }, { data: allItems }, { data: allEstados }] = await Promise.all([
    window._db.from('ventas').select('id, folio, tipo_entrega').eq('tenant_id', POS.TENANT_ID).in('id', ventaIds),
    window._db.from('venta_items').select('id_venta, nombre, cantidad, modificadores').eq('tenant_id', POS.TENANT_ID).in('id_venta', ventaIds),
    window._db.from('orden_items_estado').select('id, id_orden_cocina, id_receta, nombre_platillo, estado, creada_en, listo_en, tiempo_real_seg, tiempo_amarillo_seg, tiempo_rojo_seg').eq('tenant_id', POS.TENANT_ID).in('id_orden_cocina', ordenIds)
  ])

  const ventaMap  = {}; (ventas    || []).forEach(v  => { ventaMap[v.id] = v })
  const itemsMap  = {}; (allItems  || []).forEach(it => { if (!itemsMap[it.id_venta]) itemsMap[it.id_venta] = []; itemsMap[it.id_venta].push(it) })
  const estadoMap = {}; (allEstados|| []).forEach(e  => { if (!estadoMap[e.id_orden_cocina]) estadoMap[e.id_orden_cocina] = []; estadoMap[e.id_orden_cocina].push(e) })

  const grid = document.getElementById('kds-grid')
  ords.forEach(ord => {
    const venta       = ventaMap[ord.id_venta] || {}
    const ordenCompleta = { ...ord, folio: venta.folio, tipo_entrega: venta.tipo_entrega }
    const items       = itemsMap[ord.id_venta]  || []
    const itemsEstado = estadoMap[ord.id]        || []
    itemsEstado.forEach(i => { itemsEstadoIdx[i.id] = ord.id_venta })
    const card = crearCard(ordenCompleta, items, itemsEstado)
    grid.appendChild(card)
    ordenes[ord.id_venta] = { orden: ordenCompleta, items, itemsEstado }
  })
  mostrarVacio()
}

// ── Realtime ───────────────────────────────────────────────────────────────────
function suscribirRealtime() {
  window._db
    .channel('cocina-' + POS.TENANT_ID)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ordenes_cocina', filter: 'tenant_id=eq.' + POS.TENANT_ID },
    async payload => {
      const ord = payload.new || payload.old
      if (!ord) return

      if (payload.eventType === 'INSERT') {
        const [{ data: venta }, { data: items }, { data: itemsEstado }] = await Promise.all([
          window._db.from('ventas').select('id, folio, tipo_entrega').eq('id', ord.id_venta).eq('tenant_id', POS.TENANT_ID).single(),
          window._db.from('venta_items').select('id_venta, nombre, cantidad, modificadores').eq('id_venta', ord.id_venta).eq('tenant_id', POS.TENANT_ID),
          window._db.from('orden_items_estado').select('id, id_orden_cocina, id_receta, nombre_platillo, estado, creada_en, listo_en, tiempo_real_seg, tiempo_amarillo_seg, tiempo_rojo_seg').eq('id_orden_cocina', ord.id).eq('tenant_id', POS.TENANT_ID)
        ])
        const ordenCompleta = { ...ord, folio: venta?.folio, tipo_entrega: venta?.tipo_entrega }
        const ie = itemsEstado || []
        ie.forEach(i => { itemsEstadoIdx[i.id] = ord.id_venta })
        const card = crearCard(ordenCompleta, items || [], ie)
        document.getElementById('kds-grid').appendChild(card)
        ordenes[ord.id_venta] = { orden: ordenCompleta, items: items || [], itemsEstado: ie }
        mostrarVacio()
      }

      if (payload.eventType === 'UPDATE') {
        const nuevo = payload.new
        if (nuevo.estado === 'entregada' || nuevo.estado === 'cancelada') {
          document.getElementById('kds-ord-' + nuevo.id_venta)?.remove()
          const o = ordenes[nuevo.id_venta]
          if (o) {
            addCementerio({ ...o.orden, estado: nuevo.estado })
            ;(o.itemsEstado || []).forEach(i => { delete itemsEstadoIdx[i.id] })
          }
          delete ordenes[nuevo.id_venta]
          mostrarVacio()
        }
      }
    })
    .subscribe((status) => {
      const ind = document.getElementById('kds-conn')
      if (status === 'SUBSCRIBED') { ind.textContent = '🟢 En vivo'; ind.style.color = '#2ECC71' }
      else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
        ind.textContent = '🔴 Desconectado — reconectando...'; ind.style.color = '#FF6B6B'
        setTimeout(() => { window._db.removeAllChannels(); suscribirRealtime() }, 3000)
      } else { ind.textContent = '🟡 Conectando...'; ind.style.color = '#FFD166' }
    })

  // Suscripción a orden_items_estado para checks en tiempo real
  window._db
    .channel('items-estado-cocina-' + POS.TENANT_ID)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orden_items_estado', filter: 'tenant_id=eq.' + POS.TENANT_ID },
    payload => {
      const row = payload.new
      if (!row) return
      const idVenta = itemsEstadoIdx[row.id]
      if (!idVenta) return
      const o = ordenes[idVenta]
      if (!o) return
      const idx = (o.itemsEstado || []).findIndex(i => i.id === row.id)
      if (idx >= 0) o.itemsEstado[idx] = { ...o.itemsEstado[idx], ...row }
      actualizarCard(idVenta)
    })
    .subscribe()
}

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('kds-tenant-nombre').textContent = POS.NOMBRE + ' — Cocina'
  applyTenantTheme(POS.TENANT_ID)
  await cargarActivas()
  suscribirRealtime()
})
</script>
</body>
</html>
